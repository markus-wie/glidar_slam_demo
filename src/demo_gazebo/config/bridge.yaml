---
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  subscriber_queue: 1
  publisher_queue: 1
  lazy: False
  direction: GZ_TO_ROS
  qos_profile: "CLOCK"
- ros_topic_name: "/gz/odom"
  gz_topic_name: "/gz/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  subscriber_queue: 1
  publisher_queue: 1
  lazy: false  
  direction: GZ_TO_ROS
- ros_topic_name: "/gz/tf"
  gz_topic_name: "/model/car/pose"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS
- ros_topic_name: "/gz/tf_static"
  gz_topic_name: "/model/car/pose_static"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS


